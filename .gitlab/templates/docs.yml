traceability:
  stage: traceability
  extends: .rules_testplan_changes
  needs:
    - job: utf8_posix_check
      optional: true
  image: ghcr.io/astral-sh/uv:0.11.14-debian-slim@sha256:2702577da32d9c3d55c8073e07d4476cd7402c085efbf71921104548c851d96a
  variables:
    UV_LINK_MODE: "copy"
  script:
    - uv sync --project docs/scripts
    - uv run --project docs/scripts python -m unittest discover -s docs/scripts/tests
    - uv run --project docs/scripts tag-masvs-scenarios --mapping-csv docs/masvs_mapping.csv --check
    - uv run --project docs/scripts traceability --project-root .
    - uv run --project docs/scripts generate-cucumber-methods
  artifacts:
    paths:
      - docs/asciidoc/diagrams
      - docs/asciidoc/tables
      - target/generated-docs/traceability.json
    expire_in: 1 week

gitlab_issue_sync:
  stage: issue-sync
  image: ghcr.io/astral-sh/uv:0.11.14-debian-slim@sha256:2702577da32d9c3d55c8073e07d4476cd7402c085efbf71921104548c851d96a
  extends: .rules_default_branch_only
  needs:
    - job: test
  allow_failure: true
  variables:
    UV_LINK_MODE: "copy"
    SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates
    - uv sync --project docs/scripts
    - uv run --project docs/scripts gitlab-issue-sync --process-mrs --include-mr-ta --apply --sleep 0 --report-changes

docs:
  stage: docs
  extends: .rules_testplan_changes
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/uwebarthel/asciidoctor:1.104.0@sha256:42b0829a44befce03c80ad0d00ec83fdddb1b43dfcd5c137a32a081ba1a0b447
  needs:
    - job: traceability
      artifacts: true
  script:
    - mkdir -p docs
    - |
      asciidoctor \
        -r asciidoctor-diagram \
        -a data-uri \
        -a docinfo=shared \
        -a puppeteer-config=docs/puppeteer-config.json \
        -D docs \
        docs/asciidoc/Testplan_ZETA.adoc
  artifacts:
    paths:
      - docs/Testplan_ZETA.html
    expire_in: 1 week

pages:
  stage: pages
  extends: .rules_default_branch_only
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/busybox:1.36.1-glibc@sha256:7e567dff0fbaa48cddc5f52ae5201a7f417436aa20e70c8750814692043dfa38
  needs:
    - job: docs
      artifacts: true
  script:
    - mkdir -p public
    - cp docs/Testplan_ZETA.html public/index.html
  pages:
    publish: public
    expire_in: 1 week
