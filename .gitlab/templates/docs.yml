traceability:
  stage: traceability
  extends: .rules_testplan_changes
  needs:
    - job: utf8_posix_check
      optional: true
  image: $UV_TOOLS_IMAGE
  script:
    - uv sync --project docs/scripts --locked
    - uv run --project docs/scripts --no-sync generate-doc-includes
    - uv run --project docs/scripts --no-sync tag-masvs-scenarios --mapping-csv docs/masvs_mapping.csv --check
    - uv run --project docs/scripts --no-sync traceability --project-root .
    - uv run --project docs/scripts --no-sync generate-cucumber-methods
    - uv run --project docs/scripts --no-sync pytest docs/scripts/tests
    - uv run --project docs/scripts --no-sync check-zeta-design
  artifacts:
    when: always
    paths:
      - docs/asciidoc/diagrams
      - docs/asciidoc/tables
      - target/design-verification.json
      - docs/asciidoc/afos/*/readme.adoc
      - docs/asciidoc/testaspekte/**/readme.adoc
      - docs/asciidoc/testaspekte/readme.adoc
    expire_in: 1 week

gitlab_issue_sync:
  stage: issue-sync
  image: $UV_TOOLS_IMAGE
  extends: .rules_default_branch_only
  needs:
    - job: test
  allow_failure: true
  variables:
    SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  script:
    - uv run --project docs/scripts --locked --no-dev gitlab-issue-sync --process-mrs --include-mr-ta --apply --sleep 0 --report-changes

docs:
  stage: docs
  extends: .rules_testplan_changes
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/uwebarthel/asciidoctor:1.104.0@sha256:42b0829a44befce03c80ad0d00ec83fdddb1b43dfcd5c137a32a081ba1a0b447
  needs:
    - job: traceability
      artifacts: true
  script:
    - apk add --no-cache npm
    - |
      PNPM_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").findtext("{*}properties/{*}version.pnpm"))')"
      npx --yes "pnpm@$PNPM_VERSION" install \
        --frozen-lockfile --ignore-scripts --dir docs \
        --modules-dir ../target/node_modules --store-dir ../target/pnpm-store
    - |
      DOCS_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").findtext("{*}version"))')"
      asciidoctor \
        --failure-level ERROR \
        -r asciidoctor-diagram \
        -a data-uri \
        -a docinfo=shared \
        -a revnumber="$DOCS_VERSION" \
        -a mmdc="$CI_PROJECT_DIR/target/node_modules/.bin/mmdc" \
        -a mermaid-puppeteer-config="$CI_PROJECT_DIR/docs/puppeteer-config.json" \
        -D docs \
        docs/asciidoc/Testplan_ZETA.adoc
  artifacts:
    paths:
      - docs/Testplan_ZETA.html
    expire_in: 1 week

pages:
  stage: pages
  extends: .rules_default_branch_only
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/busybox:1.36.1-glibc@sha256:7e567dff0fbaa48cddc5f52ae5201a7f417436aa20e70c8750814692043dfa38
  needs:
    - job: docs
      artifacts: true
  script:
    - mkdir -p public
    - cp docs/Testplan_ZETA.html public/index.html
  pages:
    publish: public
    expire_in: 1 week
