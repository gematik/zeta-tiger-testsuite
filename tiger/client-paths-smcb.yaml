client:
  authMode: "SMB"
  deploymentName: "testdriver-smcb"
  containerName: "testdriver-smcb"
  baseUrl: "http://zetaClient"
  # Share the resource suffix with the Guard and Fachdienst observation paths.
  helloZeta: "${paths.client.baseUrl}${paths.client.helloZetaPath}"
  helloZetaPath: "/td-smcb/proxy${paths.fachdienst.helloZetaPath}"
  helloZetaProxyError: "http://zetaClient/td-smcb/proxy/achelos_testfachdienst/hellozeta/proxy-error"
  helloZetaProxyErrorPath: "/td-smcb/proxy/achelos_testfachdienst/hellozeta/proxy-error"
  configure: "http://zetaClient/td-smcb/testdriver-api/configure"
  discover: "http://zetaClient/td-smcb/testdriver-api/discover"
  register: "http://zetaClient/td-smcb/testdriver-api/register"
  reset: "http://zetaClient/td-smcb/testdriver-api/reset"
  websocketBaseUrl: "wss://${zeta_base_url}/td-smcb/proxy/achelos_testfachdienst/ws"
  storage: "http://zetaClient/td-smcb/testdriver-api/storage"
  storagePath: "/td-smcb/testdriver-api/storage"
  loadDriverPathPrefix: "/td-smcb/loaddriver-api"
  clients: "${paths.client.baseUrl}${paths.client.clientsPath}"
  clientsPath: "/td-smcb/testdriver-api/clients"
  registration: "${paths.client.baseUrl}${paths.client.registrationPath}"
  registrationPath: "/td-smcb/testdriver-api/registration"
  loadCreateInstances: "${paths.client.baseUrl}${paths.client.loadCreateInstancesPath}"
  loadCreateInstancesPath: "/td-smcb/load/create_instances"
  loadListInstances: "${paths.client.baseUrl}${paths.client.loadListInstancesPath}"
  loadListInstancesPath: "/td-smcb/load/list_instances"
  loadDeleteInstances: "${paths.client.baseUrl}${paths.client.loadDeleteInstancesPath}"
  loadDeleteInstancesPath: "/td-smcb/load/delete_instances"
  loadResourcePathPrefix: "/td-smcb/load"
  loadRegistration: "${paths.client.baseUrl}${paths.client.loadRegistrationPath}"
  loadRegistrationPath: "/td-smcb/loaddriver-api/${CC_SECOND_SDK_ID}/registration"
  notifications:
    pushers: "http://zetaClient/td-smcb/testdriver-api/notifications/pushers"
    pushersPath: "/td-smcb/testdriver-api/notifications/pushers"
    channels: "http://zetaClient/td-smcb/testdriver-api/notifications/channels"
    channelsPath: "/td-smcb/testdriver-api/notifications/channels"
    channelsLocal: "http://zetaClient/td-smcb/testdriver-api/notifications/channels/local"
    channelsLocalPath: "/td-smcb/testdriver-api/notifications/channels/local"
  notificationTestEvents: "${paths.client.baseUrl}${paths.client.notificationTestEventsPath}"
  notificationTestEventsPath: "/td-smcb/proxy${paths.fachdienst.notificationTestEventsPath}"
  notificationTestEventsWithPopp: "${paths.client.baseUrl}/td-smcb/proxy${paths.fachdienst.notificationTestEventsWithPoppPath}"

erezept:
  rest:
    proxyPath: "/td-smcb/proxy/achelos_testfachdienst/api/erezept"
