# names for prometheus queries, i.e. used for metrics
# corresponds to query label container
container:
  ingress: 'nginx-ingress'
  egress: 'nginx-ingress' # same as ingress
  httpProxy: 'nginx'
  helperMetrics: 'metrics' # helper of httpProxy
  # pepDatabase: 'database-pep' # Dummy value, component not provided
  authorizationServer: 'keycloak'
  pdpDatabase: 'postgresql'
  policyEngine: 'opa'
  notificationService: 'notification-service' # Dummy value, TODO: container not available yet, name not yet known
  # managementService: 'management-service' # Dummy value, component not provided
  telemetryDataService: 'telemetry-gateway'
  resourceServer: 'testfachdienst'

# names for opensearch queries, i.e. used for logs
# corresponds to query parameter resource.k8s.container.name
containerName:
  ingress: 'nginx-ingress'
  egress: 'nginx-ingress' # same as ingress
  httpProxy: 'nginx'
  helperMetrics: 'metrics' # helper of httpProxy
  # pepDatabase: 'database-pep' # Dummy value, component not provided
  authorizationServer: 'keycloak'
  pdpDatabase: 'postgresql'
  policyEngine: 'opa'
  notificationService: 'notification-service' # Dummy value, TODO: container not available yet, name not yet known
  # managementService: 'management-service' # Dummy value, component not provided
  telemetryDataService: 'telemetry-gateway'
  resourceServer: 'testfachdienst'

# names for jaeger queries, i.e. used for traces
# corresponds to query parameter service
service:
  ingress: 'nginx-ingress'
  egress: 'nginx-ingress' # same as ingress
  httpProxy: 'ZETA Guard PEP HTTP proxy'
  helperMetrics: 'metrics' # helper of httpProxy
  # pepDatabase: 'database-pep' # Dummy value, component not provided
  authorizationServer: 'ZETA Guard PDP authorization server'
  pdpDatabase: 'postgresql'
  policyEngine: 'ZETA Guard PDP policy engine'
  notificationService: 'notification-service' # Dummy value, TODO: container not available yet, name not yet known
  # managementService: 'management-service' # Dummy value, component not provided
  telemetryDataService: 'telemetry-gateway'
  resourceServer: 'resource server'

# span_name label values for prometheus span metrics
span:
  httpProxy:
    asl: '/ASL'
    pep: '/pep/'
    wellKnown: '/.well-known/'
  authorizationServer:
    nonce: 'NonceProvider.createNonce'
    nonce2: 'GET /realms/{realm}/{extension}'
    clientRegistration: 'POST /realms/{realm}/clients-registrations/{provider}'
    token: 'POST /realms/{realm}/protocol/{protocol}/token'
  policyEngine:
    data: 'POST /v1/data/{path...}'

# comma-separated span_name groups for combined prometheus assertions
spanGroup:
  httpProxy:
    pepAndWellKnown: '/pep/,/.well-known/'
    aslPepAndWellKnown: '/ASL,/pep/,/.well-known/'
  authorizationServer:
    nonceAndToken: 'NonceProvider.createNonce,POST /realms/{realm}/protocol/{protocol}/token'
    nonceRegisterAndToken: 'NonceProvider.createNonce,POST /realms/{realm}/clients-registrations/{provider},POST /realms/{realm}/protocol/{protocol}/token'
