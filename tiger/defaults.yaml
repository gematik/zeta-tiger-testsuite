# Hostname (without scheme) for the external ZETA deployment.
# The value is reused for HTTPS and WSS targets by the features and the tiger config.
# Override via environment variable ZETA_BASE_URL or Maven property -Dzeta_base_url=....
zeta_base_url: zeta-kind.local

# Hostname (without scheme) for the external Keycloak endpoint.
# Override via environment variable KEYCLOAK_URL or Maven property -Dkeycloak_url=....
keycloak_url: authserver

# Hostname (without scheme) for the PEP HTTP Proxy endpoint.
# Override via environment variable PEP_HTTP_PROXY_URL or Maven property -Dpep_http_proxy_url=....
pep_http_proxy_url: pep-proxy-svc

zeta_proxy_url: localhost:9999

allow_deployment_modification: false
allow_performance_tests: false

# Plaintext gRPC service address of the load dispenser.
# Override via environment variable LOAD_DISPENSER_URL.
load_dispenser_url: localhost:50051

# PoPP token generator endpoint used by functional PoPP token steps.
# The Load Dispenser signs valid PoPP tokens internally for hellozeta workloads.
# Override via environment variable POPP_TOKEN_GENERATOR_URL or Maven property
# -Dpopp_token_generator_url=....
popp_token_generator_url: https://${zeta_base_url}/popp-token-generator/popp/test/api/v1/token-generator

# config keys related to steps that modify a ZETA Guard deployment
zeta_k8s_namespace: zeta-local
zeta_k8s_command_timeout: 300
zeta_k8s_pod_ready_timeout: 300
zeta_k8s_helm_deployment_directory: ../zeta-guard-helm
zeta_k8s_smb_keystore_file: ../zeta-test-certificates/smcb/smcb-certificates.p12.b64
zeta_k8s_smb_keystore_password_file: ../zeta-test-certificates/smcb/smcb-pw
zeta_k8s_enable_asl_globally: false
zeta_k8s_disable_asl_globally: false

schemaValidation:
  # If false, schema validation treats object schemas as strict by default and
  # rejects additional properties unless the schema explicitly allows them.
  allowAdditionalProperties: true
  # If set to true, the scenarios will continue with the next test steps
  # instead of stopping on validation errors.
  soft: true

# OpenSearch host (without scheme) for telemetry lookups.
# Override via environment variable OPENSEARCH_URL or Maven property -Dopensearch_url=....
opensearch_url: ${zeta_base_url}:9200

# Prometheus host (without scheme) for telemetry metrics lookups.
# Override via environment variable PROMETHEUS_URL or Maven property -Dprometheus_url=....
prometheus_url: ${zeta_base_url}:9090

# Directory of the sibling zeta-test-certificates checkout.
# Override via environment variable ZETA_TEST_CERTIFICATES_DIR or Maven property
# -DtestCertificates.dir=....
testCertificates.dir: ../zeta-test-certificates

# TLS Test Tool Service URL
# Override via environment variable ZETA_TLS_TEST_TOOL_SERVICE_URL or Maven property
# -Dzeta_tls_test_tool_service_url=....
zeta_tls_test_tool_service_url: ${zeta_base_url}:9012

# Certificate validation mock URL
# Override via Maven property -Dzeta_cert_validation_mock_url=....
zeta_cert_validation_mock_url: ${zeta_base_url}:9013
