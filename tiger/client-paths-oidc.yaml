client:
  authMode: "OIDC"
  deploymentName: "testdriver-oidc"
  containerName: "testdriver-oidc"
  baseUrl: "http://zetaClient"
  helloZeta: "http://zetaClient/td-oidc/proxy/achelos_testfachdienst/no-popp/hellozeta"
  helloZetaPath: "/td-oidc/proxy/achelos_testfachdienst/no-popp/hellozeta"
  helloZetaProxyError: "http://zetaClient/td-oidc/proxy/achelos_testfachdienst/no-popp/hellozeta/proxy-error"
  helloZetaProxyErrorPath: "/td-oidc/proxy/achelos_testfachdienst/no-popp/hellozeta/proxy-error"
  configure: "http://zetaClient/td-oidc/testdriver-api/configure"
  discover: "http://zetaClient/td-oidc/testdriver-api/discover"
  register: "http://zetaClient/td-oidc/testdriver-api/register"
  reset: "${paths.client.baseUrl}${paths.client.resetPath}"
  resetPath: "/td-oidc/testdriver-api/reset"
  websocketBaseUrl: "wss://${zeta_base_url}/td-oidc/proxy/achelos_testfachdienst/no-popp/ws"
  storage: "http://zetaClient/td-oidc/testdriver-api/storage"
  storagePath: "/td-oidc/testdriver-api/storage"
  loadDriverPathPrefix: "/td-oidc/loaddriver-api"
  clients: "${paths.client.baseUrl}${paths.client.clientsPath}"
  clientsPath: "/td-oidc/testdriver-api/clients"
  registration: "${paths.client.baseUrl}${paths.client.registrationPath}"
  registrationPath: "/td-oidc/testdriver-api/registration"
  loadCreateInstances: "${paths.client.baseUrl}${paths.client.loadCreateInstancesPath}"
  loadCreateInstancesPath: "/td-oidc/load/create_instances"
  loadListInstances: "${paths.client.baseUrl}${paths.client.loadListInstancesPath}"
  loadListInstancesPath: "/td-oidc/load/list_instances"
  loadDeleteInstances: "${paths.client.baseUrl}${paths.client.loadDeleteInstancesPath}"
  loadDeleteInstancesPath: "/td-oidc/load/delete_instances"
  loadResourcePathPrefix: "/td-oidc/load"
  loadRegistration: "${paths.client.baseUrl}${paths.client.loadRegistrationPath}"
  loadRegistrationPath: "/td-oidc/loaddriver-api/${CC_SECOND_SDK_ID}/registration"
  notifications:
    pushers: "http://zetaClient/td-oidc/testdriver-api/notifications/pushers"
    pushersPath: "/td-oidc/testdriver-api/notifications/pushers"
    channels: "http://zetaClient/td-oidc/testdriver-api/notifications/channels"
    channelsPath: "/td-oidc/testdriver-api/notifications/channels"
    channelsLocal: "http://zetaClient/td-oidc/testdriver-api/notifications/channels/local"
    channelsLocalPath: "/td-oidc/testdriver-api/notifications/channels/local"
  notificationTestEvents: "${paths.client.baseUrl}${paths.client.notificationTestEventsPath}"
  notificationTestEventsPath: "/td-oidc/proxy${paths.fachdienst.notificationTestEventsPath}"
  notificationTestEventsWithPopp: "${paths.client.baseUrl}/td-oidc/proxy${paths.fachdienst.notificationTestEventsWithPoppPath}"
  oidc:
    helloZeta: "${paths.client.helloZeta}"
    helloZetaPath: "${paths.client.helloZetaPath}"
    kvnrEmail: "http://zetaClient/td-oidc/oidc/kvnr-email"
    kvnrEmailPath: "/td-oidc/oidc/kvnr-email"
    verifyOtp: "http://zetaClient/td-oidc/oidc/verify-otp"
    verifyOtpPath: "/td-oidc/oidc/verify-otp"
    resendOtp: "http://zetaClient/td-oidc/oidc/resend-otp"
    resendOtpPath: "/td-oidc/oidc/resend-otp"

guard:
  helloZetaPath: "/pep/achelos_testfachdienst/no-popp/hellozeta"
  helloZetaProxyErrorPath: "/pep/achelos_testfachdienst/no-popp/hellozeta/proxy-error"

fachdienst:
  notificationTestEventsPath: "/achelos_testfachdienst/no-popp/test-support/notifications"
  helloZetaPath: "/achelos_testfachdienst/no-popp/hellozeta"
  helloZetaProxyErrorPath: "/achelos_testfachdienst/no-popp/hellozeta/proxy-error"

erezept:
  rest:
    pepPath: "/pep/achelos_testfachdienst/no-popp/api/erezept"
    rsPath: "/achelos_testfachdienst/no-popp/api/erezept"
    proxyPath: "/td-oidc/proxy/achelos_testfachdienst/no-popp/api/erezept"
  websocket:
    userQueue: "/achelos_testfachdienst/no-popp/user/queue/erezept"
    appChannels:
      create: "/achelos_testfachdienst/no-popp/app/erezept.create"
      list: "/achelos_testfachdienst/no-popp/app/erezept.list"
      readPrefix: "/achelos_testfachdienst/no-popp/app/erezept.read."
      updatePrefix: "/achelos_testfachdienst/no-popp/app/erezept.update."
      deletePrefix: "/achelos_testfachdienst/no-popp/app/erezept.delete."
