androidRegistration:
  triggerUrl: "http://zetaClient/td-oidc/testdriver-api/hellozeta/android"
  triggerPath: "/td-oidc/testdriver-api/hellozeta/android"
  guardHost: "${zeta_base_url}"
  trustAnchors: "src/test/resources/certificates/android/google-attestation-roots.pem"

appleRegistration:
  triggerUrl: "http://zetaClient${paths.appleRegistration.triggerPath}"
  triggerPath: "/td-oidc/testdriver-api/hellozeta/ios"
  guardHost: "${zeta_base_url}"
  trustAnchors: "src/test/resources/certificates/apple/apple-app-attestation-root.pem"

mailcatcher:
  # Mailcatcher is exposed by the Tiger proxy below the same ingress host as
  # the testdriver. The API returns captured message summaries as JSON.
  messages: "http://zetaClient/mailcatcher/messages"
  messagesPath: "/mailcatcher/messages"

nativeClient:
  deploymentName: "nativedriver"
  baseUrl: "http://zetaClient"
  helloZeta: "http://zetaClient/nativedriver-api/hellonative"
  helloZetaPath: "/nativedriver-api/hellonative"
  configure: "http://zetaClient/nativedriver-api/configure"
  reset: "http://zetaClient/nativedriver-api/reset"

erezept:
  rest:
    pepPath: "/pep/achelos_testfachdienst/api/erezept"
    rsPath: "/achelos_testfachdienst/api/erezept"

  websocket:
    userQueue: "/achelos_testfachdienst/user/queue/erezept"
    appChannels:
      create: "/achelos_testfachdienst/app/erezept.create"
      list: "/achelos_testfachdienst/app/erezept.list"
      readPrefix: "/achelos_testfachdienst/app/erezept.read."
      updatePrefix: "/achelos_testfachdienst/app/erezept.update."
      deletePrefix: "/achelos_testfachdienst/app/erezept.delete."

fachdienst:
  upstreamBasePath: "/testfachdienst"
  routingUpstream: "http://tiger-proxy"
  notificationTestEventsPath: "/achelos_testfachdienst/test-support/notifications"
  notificationTestEventsWithPoppPath: "/achelos_testfachdienst/test-support/notifications"
  helloZetaPath: "/achelos_testfachdienst/hellozeta"
  helloZetaProxyErrorPath: "/achelos_testfachdienst/hellozeta/proxy-error"

guard:
  baseUrl: "http://zetaGuard"
  issuerUrl: "https://${zeta_base_url}/auth/realms/zeta-guard"
  brokerEndpointPath: "/auth/realms/zeta-guard/broker/zeta-sekidp-oidc/endpoint"
  notificationServiceUrl: "https://${zeta_base_url}/notification-service"
  pepRoutePrefix: "/pep/"
  notificationServiceRs: "http://zetaGuard/notification-service-rs"
  notificationServiceRsPath: "/notifications"
  notificationTestEventsPath: "/pep${paths.fachdienst.notificationTestEventsPath}"
  notificationUsersPathPrefix: "/users/"
  notificationPushersSetPath: "/push/v1/pushers/set"
  notificationPushersPath: "/push/v1/pushers"
  notificationChannelsPath: "/push/v1/channels"
  # Expected identities from the local Helm notification/authserver configuration.
  notificationAuthorizationServerUri: "https://${zeta_base_url}/"
  notificationProtectedResourcePath: "/.well-known/oauth-protected-resource/notification-service"
  notificationChannelsPathPrefix: "/push/v1/channels/"
  helloZetaPath: "/pep${paths.fachdienst.helloZetaPath}"
  helloZetaProxyErrorPath: "/pep/achelos_testfachdienst/hellozeta/proxy-error"
  tokenEndpointPath: "/auth/realms/zeta-guard/protocol/openid-connect/token"
  certsEndpointPath: "/auth/realms/zeta-guard/protocol/openid-connect/certs"
  registerEndpointPath: "/auth/realms/zeta-guard/clients-registrations/openid-connect"
  registerVerifyEndpointPath: "${paths.guard.registerEndpointPath}/verify"
  nonceEndpointPath: "/auth/realms/zeta-guard/zeta-guard-nonce"
  bindEmailPath: "/auth/realms/zeta-guard/zeta/identity/bind-email"
  bindEmailVerifyPath: "/auth/realms/zeta-guard/zeta/identity/bind-email/verify"
  clientsManagementPath: "/auth/realms/zeta-guard/zeta/clients"
  wellKnownOAuthServerPath: "/.well-known/oauth-authorization-server"
  wellKnownOAuthProtectedResourcePath: "/.well-known/oauth-protected-resource"
  wellKnownTiServiceProviderMetadataPath: "/.well-known/ti-service-provider-metadata"
  wellKnownAuthServerPath: "/auth/realms/zeta-guard/.well-known/zeta-guard-well-known"
  # OpenID Federation 1.0 Entity Statement endpoint required by A_25656.
  wellKnownFederationPath: "/auth/realms/zeta-guard/.well-known/openid-federation"
  actuatorHealthPath: "/actuator/health"
  managementServicePath: "/managementService"
  ecKeyFile: "src/test/resources/keys/${zeta_base_url}-ecKey.pem"
  helloZetaFullPath: "https://${zeta_base_url}${paths.guard.helloZetaPath}"

sectoralIdp:
  authorizationEndpointPath: "/auth"
  # The local/staged SekIDP receives the token exchange at /token. The
  # /sekidp ingress prefix is not part of the RBEL-recorded request path.
  tokenEndpointPath: "/token"

tigerProxy:
  baseUrl: "http://${zeta_proxy_url}"
  manipulationPath: "/manipulation/modification"
  modificationPath: "/modification"
  resetJwtManipulationPath: "/manipulation/resetJwtManipulation"
  modifyJwtPath: "/manipulation/modifyJwt"
  resetMessagesPath: "/resetMessages"
  messagesWithMetaPath: "/getMessageIndex"
  messageContentPath: "/messageContent"

opa:
  decisionPath: "/v1/data/policies/zeta/authz/decision"

popp:
  ecKeyFile: "src/test/resources/keys/popp-token-server_ecKey.pem"
  jwks: "/jwks.json"
  signedJwks: "/.well-known/signed-jwks"
  tokenGenerator: "${popp_token_generator_url}"

openSearch:
  baseUrl: "http://${opensearch_url}"
  openTelemetryLogsSearchPath: "/otel-logs-*/_search"
  openTelemetryLogsSearchPathPattern: "/otel-logs-.*/_search.*"

loadDispenser:
  endpoint: "${load_dispenser_url}"

prometheus:
  baseUrl: "http://${prometheus_url}"
  prometheusMetricsSearchPath: "/api/v1/query"
  prometheusMetricsSearchPathPattern: "/api/v1/query.*"
  prometheusMetricsRangeSearchPath: "/api/v1/query_range"
  
jaeger:
  baseUrl: "http://${jaeger_url}"
  jaegerTracesSearchPath: "/jaeger/ui/api/traces"
  jaegerTracesSearchPathPattern: "/jaeger/ui/api/traces.*"

androidClient:
  baseUrl: "http://zetaClient"
  reset: "${paths.androidClient.baseUrl}/androiddriver-api/reset"
  resetPath: "/androiddriver-api/reset"
  notifications:
    register: "${paths.androidClient.baseUrl}/androiddriver-api/notifications/register"
    registerPath: "/androiddriver-api/notifications/register"
    subscribeAll: "${paths.androidClient.baseUrl}/androiddriver-api/notifications/subscribe-all"
    subscribeAllPath: "/androiddriver-api/notifications/subscribe-all"
    unsubscribeAll: "${paths.androidClient.baseUrl}/androiddriver-api/notifications/unsubscribe-all"
    received: "${paths.androidClient.baseUrl}/androiddriver-api/notifications/received"
    receivedPath: "/androiddriver-api/notifications/received"

pushGateway:
  encryptedDispatchPath: "/push/v1/notifyEncrypted/batch"
