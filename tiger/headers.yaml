# NOTE:
# Prefer nested full keys (e.g. ${headers.dpop.body.jti}).
# Do not compose paths via concatenation like ${headers.dpop}.body.jti.

authorization:
  root: "$.header.[~'Authorization']"
  strict: "$.header.Authorization"
  dpopToken:
    root: "$.header.[~'Authorization'].DpopToken"
    body:
      sub: "$.header.[~'Authorization'].DpopToken.body.sub"
      common_name: "$.header.[~'Authorization'].DpopToken.body.common_name"
      profession_oid: "$.header.[~'Authorization'].DpopToken.body.profession_oid"
      client_id: "$.header.[~'Authorization'].DpopToken.body.client_id"
      organization_name: "$.header.[~'Authorization'].DpopToken.body.organization_name"
      cnf:
        root: "$.header.[~'Authorization'].DpopToken.body.cnf"
        jkt: "$.header.[~'Authorization'].DpopToken.body.cnf.jkt"
      product_id: "$.header.[~'Authorization'].DpopToken.body.product_id"
      product_version: "$.header.[~'Authorization'].DpopToken.body.product_version"

dpop:
  root: "$.header.[~'DPoP']"
  strict: "$.header.dpop"
  header:
    root: "$.header.[~'DPoP'].header"
    typ: "$.header.[~'DPoP'].header.typ"
    alg: "$.header.[~'DPoP'].header.alg"
    jwk:
      root: "$.header.[~'DPoP'].header.jwk"
      kty: "$.header.[~'DPoP'].header.jwk.kty"
      crv: "$.header.[~'DPoP'].header.jwk.crv"
      x: "$.header.[~'DPoP'].header.jwk.x"
      y: "$.header.[~'DPoP'].header.jwk.y"
      d: "$.header.[~'DPoP'].header.jwk.d"
  body:
    jti: "$.header.[~'DPoP'].body.jti"
    htm: "$.header.[~'DPoP'].body.htm"
    htu:
      root: "$.header.[~'DPoP'].body.htu"
      path: "$.header.[~'DPoP'].body.htu.path"
    iat: "$.header.[~'DPoP'].body.iat"
    nonce: "$.header.[~'DPoP'].body.nonce"
    ath: "$.header.[~'DPoP'].body.ath"

popp:
  root: "$.header.[~'PoPP']"
  strict: "$.header.PoPP"
  lineRegex: '(?im)^popp:[^\r\n]*\r?\n?'
  header:
    root: "$.header.[~'PoPP'].header"
    typ: "$.header.[~'PoPP'].header.typ"
    alg: "$.header.[~'PoPP'].header.alg"
    kid: "$.header.[~'PoPP'].header.kid"
  signature:
    isValid: "$.header.[~'PoPP'].signature.isValid"
  body:
    root: "$.header.[~'PoPP'].body"
    version: "$.header.[~'PoPP'].body.version"
    iss: "$.header.[~'PoPP'].body.iss"
    proofMethod: "$.header.[~'PoPP'].body.proofMethod"
    patientId: "$.header.[~'PoPP'].body.patientId"
    actorId: "$.header.[~'PoPP'].body.actorId"
    insurerId: "$.header.[~'PoPP'].body.insurerId"
    actorProfessionOid: "$.header.[~'PoPP'].body.actorProfessionOid"
    iat: "$.header.[~'PoPP'].body.iat"
    patientProofTime: "$.header.[~'PoPP'].body.patientProofTime"

forwarded:
  root: "$.header.[~'Forwarded']"
  strict: "$.header.Forwarded"
xForwardedHost: "$.header.[~'X-Forwarded-Host']"
xForwardedProto: "$.header.[~'X-Forwarded-Proto']"
xForwardedFor: "$.header.[~'X-Forwarded-For']"
xRealIp: "$.header.[~'X-Real-IP']"

zeta:
  userInfo:
    root: "$.header.[~'zeta-user-info']"
    strict: "$.header.['zeta-user-info']"
    decoded:
      root: "$.header.[~'zeta-user-info'].decoded"
      identifier: "$.header.[~'zeta-user-info'].decoded.identifier"
      professionOid: "$.header.[~'zeta-user-info'].decoded.professionOID"
      commonName: "$.header.[~'zeta-user-info'].decoded.commonName"
      organizationName: "$.header.[~'zeta-user-info'].decoded.organizationName"
  poppTokenContent:
    root: "$.header.[~'zeta-popp-token-content']"
    strict: "$.header.['zeta-popp-token-content']"
    decoded:
      root: "$.header.[~'zeta-popp-token-content'].decoded"
  clientData:
    root: "$.header.[~'zeta-client-data']"
    strict: "$.header.['zeta-client-data']"
    decoded:
      root: "$.header.[~'zeta-client-data'].decoded"
      clientId: "$.header.[~'zeta-client-data'].decoded.client_id"
      product_id: "$.header.[~'zeta-client-data'].decoded.product_id"
      product_version: "$.header.[~'zeta-client-data'].decoded.product_version"
  cause: "$.header.[~'zeta-cause']"

cacheControl: "$.header.[~'Cache-Control']"
contentType: "$.header.[~'Content-Type']"
eTag:
  lenient: "$.header.[~'ETag']"
  strict: "$.header.etag"
host: "$.header.[~'Host']"
ifNoneMatch:
  lenient: "$.header.[~'if-none-match']"
  strict: "$.header.['if-none-match']"
rateLimit:
  limit: "$.header.[~'x-rate-limit-limit']"
  remaining: "$.header.[~'x-rate-limit-remaining']"
  reset: "$.header.[~'x-rate-limit-reset']"
location:
  lenient: "$.header.[~'Location']"
  strict: "$.header.Location"
